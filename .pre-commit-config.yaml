repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  # Local hooks run the locked project tools with the same commands and scopes as
  # quality/checks.json, so the hooks and CI cannot drift apart (tests/tooling).
  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run --locked --all-extras black --check
        language: system
        pass_filenames: false
        args: [src, tests, quality, scripts, alembic, conftest.py]
      - id: ruff
        name: ruff
        entry: uv run --locked --all-extras ruff check
        language: system
        pass_filenames: false
        args: [src, tests, quality, scripts, alembic, conftest.py]
      - id: mypy
        name: mypy
        entry: uv run --isolated --locked --all-extras --python 3.11 mypy
        language: system
        pass_filenames: false
        args: [src, scripts, quality, alembic, conftest.py, tests]
