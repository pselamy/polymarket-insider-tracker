name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static required checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.26"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python
        run: uv python install 3.11
      - name: Sync locked dependencies
        run: uv sync --locked --all-extras --python 3.11
      - name: Run static profile
        run: uv run python scripts/verify.py --profile static

  compatibility:
    name: Python ${{ matrix.python-version }} compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.26"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python
        run: uv python install ${{ matrix.python-version }}
      - name: Sync locked dependencies
        run: uv sync --locked --all-extras --python ${{ matrix.python-version }}
      - name: Run compatibility profile
        run: uv run python scripts/verify.py --profile compatibility

  services:
    name: PostgreSQL and Redis required checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15@sha256:9b1d34adbce1dd07ee6e94b4a2cf698884b89bd44a6c9c12f5da8f3acbfe4957
        env:
          POSTGRES_DB: polymarket_tracker
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracker -d polymarket_tracker"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7@sha256:71da9275c5f3fcb97d0fa0c8c5b36cc995327265420f17a04bfd544f458059f7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://tracker:dev_password@localhost:5432/polymarket_tracker
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.26"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python
        run: uv python install 3.13
      - name: Sync locked dependencies
        run: uv sync --locked --all-extras --python 3.13
      - name: Run service profile
        run: uv run python scripts/verify.py --profile services

  required:
    name: Required checks
    if: always()
    needs: [static, compatibility, services]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every blocking predecessor
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          SERVICES_RESULT: ${{ needs.services.result }}
        run: |
          test "$STATIC_RESULT" = success
          test "$COMPATIBILITY_RESULT" = success
          test "$SERVICES_RESULT" = success
