name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static required checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.26"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: static-3.11
      - name: Install Python
        run: uv python install 3.11
      - name: Sync locked dependencies
        run: uv sync --locked --all-extras --python 3.11
      - name: Run static profile with mypy, Pyright, Vulture, and Complexipy
        run: uv run python scripts/verify.py --profile static

  compatibility:
    name: Python ${{ matrix.python-version }} compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.26"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: compatibility-${{ matrix.python-version }}
      - name: Install Python
        run: uv python install ${{ matrix.python-version }}
      - name: Sync locked dependencies
        run: uv sync --locked --all-extras --python ${{ matrix.python-version }}
      - name: Run compatibility profile
        run: uv run python scripts/verify.py --profile compatibility

  services:
    name: PostgreSQL and Redis required checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15@sha256:9b1d34adbce1dd07ee6e94b4a2cf698884b89bd44a6c9c12f5da8f3acbfe4957
        env:
          POSTGRES_DB: polymarket_tracker
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracker -d polymarket_tracker"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7@sha256:71da9275c5f3fcb97d0fa0c8c5b36cc995327265420f17a04bfd544f458059f7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://tracker:dev_password@localhost:5432/polymarket_tracker
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.26"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: services-3.13
      - name: Install Python
        run: uv python install 3.13
      - name: Sync locked dependencies
        run: uv sync --locked --all-extras --python 3.13
      - name: Run service profile
        run: uv run python scripts/verify.py --profile services

  apple:
    name: Apple Silicon advisory compatibility
    runs-on: macos-14
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.26"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: apple-3.13
      - name: Require the arm64 runner contract
        run: test "$(uname -m)" = arm64
      - name: Install Python
        run: uv python install 3.13
      - name: Sync locked dependencies
        run: uv sync --locked --all-extras --python 3.13
      - name: Run compatibility profile
        run: uv run python scripts/verify.py --profile compatibility

  vulture:
    name: Vulture dead code check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.26"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: vulture-3.11
      - name: Install Python
        run: uv python install 3.11
      - name: Sync locked dependencies
        run: uv sync --locked --all-extras --python 3.11
      - name: Run Vulture dead-code verification
        run: uv run --isolated --locked --all-extras --python 3.11 vulture src tests scripts alembic conftest.py

  complexipy:
    name: Complexipy complexity check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.26"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: complexipy-3.11
      - name: Install Python
        run: uv python install 3.11
      - name: Sync locked dependencies
        run: uv sync --locked --all-extras --python 3.11
      - name: Run Complexipy complexity check
        run: uv run --isolated --locked --all-extras --python 3.11 complexipy src tests scripts alembic conftest.py --max-complexity-allowed 5 --no-ignore --ignore-complexity=false

  required:
    name: Required checks
    if: always()
    needs: [static, vulture, complexipy, compatibility, services]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every blocking predecessor
        env:
          STATIC_WITH_PYRIGHT_RESULT: ${{ needs.static.result }}
          VULTURE_RESULT: ${{ needs.vulture.result }}
          COMPLEXIPY_RESULT: ${{ needs.complexipy.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          SERVICES_RESULT: ${{ needs.services.result }}
        run: |
          test "$STATIC_WITH_PYRIGHT_RESULT" = success
          test "$VULTURE_RESULT" = success
          test "$COMPLEXIPY_RESULT" = success
          test "$COMPATIBILITY_RESULT" = success
          test "$SERVICES_RESULT" = success
