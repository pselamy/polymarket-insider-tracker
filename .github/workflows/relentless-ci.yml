name: Relentless CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One live run per pull request: a newer push to the PR cancels its older runs, so only the
  # latest commit is checked. Pushes to main, merge-queue entries and manual runs are keyed by
  # commit and never cancelled. Contract: tests/tooling/test_merge_group_workflows.py.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  analysis:
    name: Full analysis (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.26"
          enable-cache: false
          github-token: ""
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: "2026.9.16"
          sha256: b6f8757201f6a2ee799f45f3f52ef7ca0b4071523637dc3b0b24264dd3333518
          install_args: --locked
          cache: false
      - name: Install Python
        run: uv python install ${{ matrix.python-version }}
      - name: Run the checked-in Relentless CI gates
        run: uv run --locked --group dev python -m quality.verify
      - name: Verify the per-cluster duplication inventory against the tree
        run: uv run --locked --group dev python -m quality.duplication_clusters_main --check

  gate:
    name: Relentless CI gate
    if: ${{ always() }}
    needs: [analysis]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every matrix result
        env:
          ANALYSIS_RESULT: ${{ needs.analysis.result }}
        run: test "$ANALYSIS_RESULT" = success
