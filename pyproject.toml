[project]
name = "polymarket-insider-tracker"
version = "0.1.0"
description = "Detect insider activity on Polymarket"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "py-clob-client>=0.1.0",
    "web3>=6.0.0",
    "httpx>=0.25.0",
    "redis>=5.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "websockets>=12.0",
    "prometheus-client>=0.19.0",
    "aiohttp>=3.9.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "black==26.5.1",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pyright==1.1.411",
    "vulture==2.16",
    "complexipy==8.0.1",
    "pre-commit>=3.0.0",
    "pyyaml>=6.0.0",
    "aiosqlite>=0.19.0",
    "fakeredis==2.38.0",
    "hypothesis==6.170.1",
]

# Vendored Relentless CI tooling. `uv run --locked --group dev python -m quality.verify`
# installs this group; the enrolled controls in quality/checks.json use these tools.
# The group reuses the `dev` extra for tools both surfaces share (black, ruff, mypy,
# pyright, vulture, complexipy, pytest, pytest-cov, pyyaml) so there is exactly one
# pin per tool, and adds only the tools the quality package needs that the extra lacks.
[dependency-groups]
dev = [
    "polymarket-insider-tracker[dev]",
    "cosmic-ray==8.7.0",
    "deptry==0.25.1",
    "grimp==3.17",
    "markdown-it-py==4.2.0",
    "mdformat==1.0.0",
    "mdformat-gfm==1.0.0",
    "packaging==26.3",
    "pytest-json-report==1.5.0",
    "types-pyyaml==6.0.12.20260906",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
required-version = ">=0.11,<0.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

# Black is the repository's formatting authority; Ruff remains the lint and import-rule engine.
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by Black)
]

[tool.ruff.lint.isort]
known-first-party = ["polymarket_insider_tracker"]

[tool.mypy]
python_version = "3.11"
files = [
    "src",
    "scripts",
    "quality",
    "alembic",
    "conftest.py",
    "tests",
]
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["py_clob_client.*", "web3.*", "redis.*", "sklearn.*", "prometheus_client.*"]
ignore_missing_imports = true

[tool.pyright]
enableTypeIgnoreComments = false
include = [
    "src/polymarket_insider_tracker",
    "scripts",
    "quality",
    "alembic",
    "conftest.py",
    "tests/__init__.py",
    "tests/alerter",
    "tests/detector",
    "tests/ingestor",
    "tests/closeness.py",
    "tests/conftest.py",
    "tests/console_capture.py",
    "tests/fakes/__init__.py",
    "tests/fakes/alerts.py",
    "tests/fakes/cancellation.py",
    "tests/fakes/clob.py",
    "tests/fakes/database.py",
    "tests/fakes/gamma.py",
    "tests/fakes/health_http.py",
    "tests/fakes/ingestion.py",
    "tests/fakes/metadata.py",
    "tests/fakes/pipeline_access.py",
    "tests/fakes/redis_await.py",
    "tests/fakes/redis_faults.py",
    "tests/fakes/trades.py",
    "tests/fakes/trades_v2.py",
    "tests/fakes/v2_walk.py",
    "tests/fakes/web3.py",
    "tests/quality",
    "tests/storage",
    "tests/test_config.py",
    "tests/test_persist_assessment.py",
    "tests/test_pipeline_persistence.py",
    "tests/test_redaction_harness_characterization.py",
    "tests/test_harness_isolation.py",
    "tests/test_sample_fixtures.py",
    "tests/test_setup.py",
    "tests/test_shutdown.py",
    "tests/test_trades_v2_config.py",
    "tests/test_endpoints.py",
    "tests/tooling",
    "tests/profiler",
    "tests/fakes/pipeline.py",
    "tests/test_pipeline.py",
    "tests/test_terminal_error_durable.py",
    "tests/test_main.py",
    "tests/test_pipeline_components.py",
    "tests/integration",
    "tests/test_pipeline_composition.py",
    "tests/test_redaction.py",
]
pythonVersion = "3.11"
stubPath = "typings"
typeCheckingMode = "strict"

# Vulture runs at its default confidence with no baseline, allowlist, ignore list, decorator
# exemption, or path exclusion; framework-consumed names are made visible through real code and tests.
[tool.vulture]
paths = ["src", "tests", "scripts", "alembic", "conftest.py", "quality"]

# Complexipy enforces cognitive complexity <= 5 across all repository-owned Python files.
# Inline ignores are disabled; functions and module-level control flow are analyzed with zero exemptions.
[tool.complexipy]
paths = ["src", "tests", "scripts", "alembic", "conftest.py", "quality"]
max-complexity-allowed = 5
no-ignore = true
check-script = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]


# Mutation testing (mutmut 3.8.0): scope the mutation job to the
# secret-redaction module and its existing test file. mutmut reads
# pyproject.toml relative to CWD; the mutation workflow runs at the repo
# root so this section applies with no extra step. only_mutate glob form
# "*/redaction.py" satisfies the config validator (patterns must end with
# ".py" or "*"). pytest_add_cli_args_test_selection feeds the harness
# selection list used by stats, forced-fail, clean-test, and per-mutant
# runs. -p no:cacheprovider keeps the run hermetic.
# also_copy closes the mutants/ import graph: run_stats executes inside
# change_cwd("mutants"), and copy_src_dir copies only source_paths (here one
# file), while mutmut's also_copy defaults already carry tests/ and
# pyproject.toml. The selected tests import sibling source modules
# (detector, ingestor, storage, ...) through the installed package path, but
# the copied mutants/src/polymarket_insider_tracker/__init__.py shadows that
# package without its siblings, so collection fails with exit 4
# (BadTestExecutionCommandsException) before any mutant verdict. Listing the
# package explicitly keeps source_paths plus only_mutate (the same five modules) as the combined
# mutation fence: only the five listed modules are ever mutated.
[tool.mutmut]
source_paths = [
    "src/polymarket_insider_tracker/redaction.py",
    "src/polymarket_insider_tracker/endpoints.py",
    "src/polymarket_insider_tracker/ingestor/_retry.py",
    "src/polymarket_insider_tracker/ingestor/_attempt_budget.py",
    "src/polymarket_insider_tracker/ingestor/_cycle_cutoff.py",
    "src/polymarket_insider_tracker/ingestor/trade_row_v2.py",
    "src/polymarket_insider_tracker/alerter/channels/pacing.py",
    "src/polymarket_insider_tracker/alerter/_history_records.py",
]
only_mutate = [
    "*/redaction.py",
    "*/endpoints.py",
    "*/_retry.py",
    "*/_attempt_budget.py",
    "*/_cycle_cutoff.py",
    "*/trade_row_v2.py",
    "*/pacing.py",
    "*/_history_records.py",
]
also_copy = ["src/polymarket_insider_tracker/", "conftest.py"]
pytest_add_cli_args_test_selection = [
    "tests/test_redaction.py",
    "tests/test_redaction_url_shapes.py",
    "tests/test_redaction_text_secrets.py",
    "tests/test_trades_v2_config.py",
    "tests/test_endpoints.py",
    "tests/test_endpoints_v1_guard_equivalence.py",
    "tests/ingestor/test_retry_policy.py",
    "tests/ingestor/test_attempt_budget_validation.py",
    "tests/ingestor/test_attempt_budget.py",
    "tests/ingestor/test_attempt_budget_properties.py",
    "tests/ingestor/test_trades_source.py",
    "tests/ingestor/test_v2_cursor_walk.py",
    "tests/ingestor/test_trade_row_v2.py",
    "tests/alerter/test_channel_pacing.py",
    "tests/alerter/test_history_extraction.py",
    "tests/alerter/test_history_gaps.py",
    "tests/alerter/test_alert_record_serialization.py",
    "tests/alerter/test_history.py",
    "-q",
    "-p",
    "no:cacheprovider",
]
