[project]
name = "polymarket-insider-tracker"
version = "0.1.0"
description = "Detect insider activity on Polymarket"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "py-clob-client>=0.1.0",
    "web3>=6.0.0",
    "httpx>=0.25.0",
    "redis>=5.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "websockets>=12.0",
    "prometheus-client>=0.19.0",
    "aiohttp>=3.9.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "black==26.5.1",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pyright==1.1.411",
    "vulture==2.16",
    "complexipy==8.0.1",
    "pre-commit>=3.0.0",
    "pyyaml>=6.0.0",
    "aiosqlite>=0.19.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
required-version = ">=0.11,<0.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

# Black is the repository's formatting authority; Ruff remains the lint and import-rule engine.
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by Black)
]

[tool.ruff.lint.isort]
known-first-party = ["polymarket_insider_tracker"]

[tool.mypy]
python_version = "3.11"
files = ["src", "scripts"]
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["py_clob_client.*", "web3.*", "redis.*", "sklearn.*", "prometheus_client.*"]
ignore_missing_imports = true

[tool.pyright]
enableTypeIgnoreComments = false
include = ["src/polymarket_insider_tracker"]
pythonVersion = "3.11"
stubPath = "typings"
typeCheckingMode = "strict"

# Vulture runs at its default confidence with no baseline, allowlist, ignore list, decorator
# exemption, or path exclusion; framework-consumed names are made visible through real code and tests.
[tool.vulture]
paths = ["src", "tests", "scripts", "alembic", "conftest.py"]

# Complexipy enforces cognitive complexity <= 5 across all repository-owned Python files.
# Inline ignores are disabled; all functions are analyzed with zero exemptions.
[tool.complexipy]
paths = ["src", "tests", "scripts", "alembic", "conftest.py"]
max-complexity-allowed = 5
no-ignore = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
