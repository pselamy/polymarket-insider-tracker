# pyproject-mutmut-delta — [tool.mutmut] config for the mutation job
#
# Apply to: pselamy/polymarket-insider-tracker @ c3b1c3dd, pyproject.toml
# (blob sha 4dacf1db0c13f62f7199f602e7cbb839aa30c3ca).
# That file has NO [tool.mutmut] section today (verified by read-only GET);
# this delta appends exactly the section below and changes nothing else.
#
# Why config, not CLI flags: mutmut 3.8.0 `run` accepts ONLY --max-children
# plus positional mutant names (src/mutmut/__main__.py @ 3.8.0, lines 937-939).
# --paths-to-mutate / --tests-dir / --runner do not exist; paths_to_mutate and
# tests_dir survive solely as deprecated config-file keys
# (src/mutmut/configuration.py @ 3.8.0). The supported spellings are
# `source_paths` and `pytest_add_cli_args_test_selection`, matching the
# official README.rst @ 3.8.0 ("Configuration" section, [tool.mutmut] form).
#
# Scoping: source_paths narrows mutation to the redaction module only, so the
# hosted run stays bounded. only_mutate is a redundant second fence on the same
# file (glob form "*/redaction.py" per configuration.py: only/do_not patterns
# must end with ".py" or "*"). pytest_add_cli_args_test_selection feeds the
# harness selection list used by stats, forced-fail, clean-test, and per-mutant
# runs (src/mutmut/runners/harness.py). -p no:cacheprovider keeps the run
# hermetic, mirroring the workflow's own baseline invocation.
#
# ---- append verbatim below this line ----
[tool.mutmut]
source_paths = ["src/polymarket_insider_tracker/redaction.py"]
only_mutate = ["*/redaction.py"]
pytest_add_cli_args_test_selection = ["tests/test_redaction.py", "-q", "-p", "no:cacheprovider"]
